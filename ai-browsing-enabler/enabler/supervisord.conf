[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

# --- egress: SOCKS5 tunnel to the exit node ---------------------------------
# Brought up first. autossh reconnects forever; until it is up, Steel/SearXNG
# egress will fail (by design — the enabler has no other route to the internet).
[program:egress-tunnel]
priority=10
command=/usr/bin/autossh -M 0 -N -D 127.0.0.1:1080
  -o ServerAliveInterval=15 -o ServerAliveCountMax=3
  -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=accept-new
  -o UserKnownHostsFile=/root/.ssh/known_hosts
  -i /root/.ssh/id_tunnel -p %(ENV_EXIT_PORT)s
  %(ENV_EXIT_USER)s@%(ENV_EXIT_HOST)s
environment=AUTOSSH_GATETIME="0"
autorestart=true
startretries=1000000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# --- search half (granian WSGI server, bound to localhost; Caddy fronts it) -
[program:searxng]
priority=20
command=/usr/local/searxng/venv/bin/granian searx.webapp:app
directory=/usr/local/searxng/searxng-src
user=searxng
environment=SEARXNG_SETTINGS_PATH="/etc/searxng/settings.yml",PYTHONPATH="/usr/local/searxng/searxng-src",GRANIAN_INTERFACE="wsgi",GRANIAN_HOST="127.0.0.1",GRANIAN_PORT="8888"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# --- browse half: Steel's own entrypoint (xvfb + dbus + nginx + node API) ----
[program:steel]
priority=20
command=/app/api/entrypoint.sh
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# --- one front door ---------------------------------------------------------
[program:caddy]
priority=30
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
